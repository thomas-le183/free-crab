name: pr-title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR title
        env:
          # Read via env, never interpolated into the script body: a PR title
          # is attacker-controlled and would otherwise be shell injection.
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -uo pipefail

          TYPES='feat|fix|perf|refactor|docs|test|chore|ci|build|revert'
          # chore is housekeeping — it carries no ticket and never reaches QC.
          NO_TICKET_TYPES='chore'
          TICKET='\([A-Z][A-Z0-9]*-[0-9]+\)'

          PATTERN="^($TYPES)(\([a-z0-9-]+\))?!?: .+ $TICKET$"
          PATTERN_NO_TICKET="^($NO_TICKET_TYPES)(\([a-z0-9-]+\))?!?: .+$"

          # The dev -> main promotion PR is titled "release: ..." — not a
          # conventional type, so it needs its own skip. (release-please's own
          # "chore(dev): release 0.2.0-rc.1" PRs pass as ticketless chores.)
          if printf '%s' "$TITLE" | grep -qE '^release: '; then
            echo "Promotion PR — skipping title check."
            exit 0
          fi

          if printf '%s' "$TITLE" | grep -qE "$PATTERN"; then
            echo "OK: $TITLE"
            exit 0
          fi
          if printf '%s' "$TITLE" | grep -qE "$PATTERN_NO_TICKET"; then
            echo "OK (ticketless type): $TITLE"
            exit 0
          fi

          cat >&2 <<MSG
          PR title does not match the required format.

            got:      $TITLE
            expected: type(scope): description (PROJ-123)
            example:  feat(billing): add bulk invoice export (PROJ-123)

          type must be one of: $TYPES
          scope is optional and lowercase; add ! before the colon for a breaking change.
          The ticket ID is uppercase, in trailing parentheses. It is required for
          every type except: $NO_TICKET_TYPES
          MSG
          exit 1
